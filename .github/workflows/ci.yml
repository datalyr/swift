name: CI

# Public repo: GitHub-hosted runners are free here, and fork PRs never run on
# paid (Blacksmith) machines. Fork PRs get a read-only token and no secrets.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same PR cancels the older run; each push to main keeps
# its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # validate.sh compares the docs' version with the newest git tag.
          fetch-depth: 0
      - name: Version match + iOS Simulator build
        run: ./scripts/validate.sh
      # The SDK ships for iOS; on a macOS host the event-queue tests see a
      # different platform path, so run them on an iOS Simulator.
      - name: Unit tests (iOS Simulator)
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          # Print each test's result and any assertion; -quiet hides which
          # assertion failed.
          xcodebuild test -scheme DatalyrSDK -destination "id=$udid" -skipPackagePluginValidation \
            | grep -E "^Test Case|error:|\*\* TEST|Executed" 
