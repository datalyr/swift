name: Bug report
description: Report a problem with the DATALYR iOS SDK.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, user data or other secrets. Report security problems as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "2.2.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: iOS version, device or simulator, Xcode version, and SPM or CocoaPods.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem. Include what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest code or steps that show the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: Set debug to true in DatalyrConfig. Paste the related lines. Remove personal data first.
      render: text
